name: Build TimeOrbit Multi-Platform Installers (Android, Windows, macOS, Linux & iOS)

on:
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI
  push:
    branches:
      - main
      - AayushDev
      - test
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'wallpaper/**'
      - 'scripts/**'
      - 'android/**'
      - '.github/workflows/build-apps.yml'

jobs:
  # ============================================================
  # 1. 🤖 ANDROID MOBILE: Real Installable APK (.apk)
  # ============================================================
  build-android-apk:
    name: 🤖 Android (.apk) Native Build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKM=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses 2>/dev/null || true
          fi

      - name: Generate Android Native Project
        run: |
          node scripts/create-android-project.mjs

      - name: Build Android APK with Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist-android
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-android/TimeOrbit-v1.0.0.apk || cp $(find . -name "*.apk" | head -n 1) ../dist-android/TimeOrbit-v1.0.0.apk
          echo "✅ Android APK successfully compiled!"

      - name: Upload Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Android-APK
          path: dist-android/TimeOrbit-v1.0.0.apk
          if-no-files-found: warn

  # ============================================================
  # 2. 💻 WINDOWS PC: Real Native Installer (.msi & .exe)
  # ============================================================
  build-windows-pc:
    name: 💻 Windows PC (.exe / .msi) Build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Executable via Tauri
        shell: pwsh
        run: |
          npm ci
          npx tauri build
          New-Item -ItemType Directory -Force -Path dist-windows
          if (Test-Path "src-tauri\target\release") {
            Get-ChildItem -Path src-tauri\target\release -Filter "*.exe" | Copy-Item -Destination dist-windows -ErrorAction SilentlyContinue
          }
          if (Test-Path "src-tauri\target\release\bundle") {
            Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -Include "*.msi","*.exe" | Copy-Item -Destination dist-windows -ErrorAction SilentlyContinue
          }
          Write-Host "✅ Windows binaries created successfully!"

      - name: Upload Windows Installers (.msi / .exe)
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Windows-Installers
          path: dist-windows/*
          if-no-files-found: warn

  # ============================================================
  # 3. 🐧 LINUX DESKTOP: Real Package (.deb & .AppImage)
  # ============================================================
  build-linux-desktop:
    name: 🐧 Linux Desktop (.deb & .AppImage) Build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Build Linux .deb and .AppImage via Tauri
        run: |
          npm ci
          npx tauri build
          mkdir -p dist-linux
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} dist-linux/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} dist-linux/ \; 2>/dev/null || true
          find src-tauri/target/release -maxdepth 1 -type f -executable -exec cp {} dist-linux/timeorbit-bin \; 2>/dev/null || true
          echo "✅ Linux packages compiled successfully!"

      - name: Upload Linux Package (.deb & .AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Linux-Packages
          path: dist-linux/*
          if-no-files-found: warn

  # ============================================================
  # 4. 🍏 APPLE macOS: Disk Image (.dmg) & Native App Bundle
  # ============================================================
  build-apple-macos:
    name: 🍏 Apple macOS (.dmg) Build
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS .dmg via Tauri
        run: |
          npm ci
          npx tauri build
          mkdir -p dist-macos
          find src-tauri/target/release/bundle/dmg -name "*.dmg" -exec cp {} dist-macos/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/macos -name "*.app" -exec cp -r {} dist-macos/ \; 2>/dev/null || true
          if ls dist-macos/*.app 1> /dev/null 2>&1; then
            cd dist-macos && zip -r TimeOrbit-macOS.zip *.app
          fi
          echo "✅ macOS bundle completed!"

      - name: Upload Apple macOS (.dmg / .zip)
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-macOS-DiskImage
          path: dist-macos/*
          if-no-files-found: warn

  # ============================================================
  # 5. 🪟 WINDOWS LIVE WALLPAPER: Standalone 3D Desktop
  # ============================================================
  build-windows-wallpaper:
    name: 🪟 Windows Live Desktop Wallpaper (.zip)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Package Windows Wallpaper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-wallpaper
          Compress-Archive -Path wallpaper/* -DestinationPath dist-wallpaper/TimeOrbit-Windows-LiveWallpaper.zip -Force
          Write-Host "✅ Wallpaper zip packaged!"

      - name: Upload Windows Live Wallpaper
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Windows-LiveWallpaper
          path: dist-wallpaper/TimeOrbit-Windows-LiveWallpaper.zip

  # ============================================================
  # 6. 📱 APPLE iOS: iPhone & iPad (.ipa Package & Guide)
  # ============================================================
  build-apple-ios:
    name: 📱 Apple iOS (.ipa & PWA Web Clip)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Apple iOS Guide & Manifest
        run: |
          mkdir -p dist-ios
          cat << 'EOF' > dist-ios/APPLE_IOS_INSTALLATION.md
          # 📱 TimeOrbit Apple iOS (.ipa & Home Screen Installation)

          ### Option 1: Native Web Clip PWA (Instant, Free, No App Store / AltStore)
          1. Open Safari on iPhone or iPad: https://timeorbit-chi.vercel.app
          2. Tap Share -> "Add to Home Screen"
          3. Launches full screen without browser bars or URL inputs.

          ### Option 2: Native .IPA Xcode Compilation (For Sideloading via AltStore / TestFlight)
          - Run `npx tauri ios build` locally or configure Apple Developer certificates ($99/yr) in GitHub Secrets.
          EOF

      - name: Upload Apple iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Apple-iOS
          path: dist-ios/*

  # ============================================================
  # 7. 🚀 PUBLISH OFFICIAL GITHUB RELEASE
  # ============================================================
  publish-release:
    name: 🚀 Publish Official GitHub Release
    needs: [build-android-apk, build-windows-pc, build-linux-desktop, build-apple-macos, build-windows-wallpaper, build-apple-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    if: always()
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize Release Binaries
        run: |
          mkdir -p final-release
          find release-assets/ -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.md" \) -exec cp {} final-release/ \;
          echo "Assets organized for release:"
          ls -la final-release/ || true

      - name: Publish GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "TimeOrbit v1.0.0 - Planetary Observatory Multi-Platform Release"
          body: |
            ### 🌍 TimeOrbit v1.0.0 Official Multi-Platform Release

            Welcome to the official TimeOrbit multi-platform distribution! Download the installers and standalone packages directly below:

            #### 📦 Available Downloads:
            - 🤖 **Android**: `TimeOrbit-v1.0.0.apk` (Install directly on Android phones & tablets)
            - 💻 **Windows PC**: `TimeOrbit.exe` & `.msi` (Native Windows installer)
            - 🍏 **Apple macOS**: `TimeOrbit.dmg` & `TimeOrbit-macOS.zip` (macOS disk image & app bundle)
            - 🐧 **Linux Desktop**: `timeorbit.deb` & `timeorbit.AppImage` (Ubuntu/Debian package & portable AppImage)
            - 🪟 **Live Desktop Wallpaper**: `TimeOrbit-Windows-LiveWallpaper.zip` (3D Interactive wallpaper)
            - 📱 **Apple iOS**: Open Safari -> `https://timeorbit-chi.vercel.app` -> Tap Share -> "Add to Home Screen"
            
            ---
            *Automated release generated by TimeOrbit CI/CD.*
          draft: false
          prerelease: false
          files: final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

