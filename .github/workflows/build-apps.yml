name: Build TimeOrbit Apps (Android APK & Windows Desktop)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - AayushDev
    paths:
      - 'src/**'
      - 'public/**'
      - 'wallpaper/**'
      - '.github/workflows/build-apps.yml'

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Install Bubblewrap CLI (Google Official TWA Compiler)
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Android APK
        env:
          APP_URL: "https://timeorbit-chi.vercel.app"
        run: |
          mkdir -p android-build
          cd android-build
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.timeorbit.app",
            "host": "timeorbit-chi.vercel.app",
            "name": "TimeOrbit",
            "launcherName": "TimeOrbit",
            "display": "standalone",
            "themeColor": "#000000",
            "themeColorDark": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "backgroundColor": "#000000",
            "startUrl": "/",
            "iconUrl": "https://timeorbit-chi.vercel.app/globe.svg",
            "maskableIconUrl": "https://timeorbit-chi.vercel.app/globe.svg",
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://timeorbit-chi.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "orientation": "any"
          }
          EOF
          bubblewrap build --manifest=twa-manifest.json --skipPwaValidation || echo "Proceeding with standard APK generation"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Android-APK
          path: |
            android-build/*.apk
            android-build/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  build-windows-package:
    name: Package Windows Live Wallpaper & Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Windows Wallpaper Bundle
        shell: pwsh
        run: |
          mkdir -p dist-windows
          Compress-Archive -Path wallpaper/* -DestinationPath dist-windows/TimeOrbit-Windows-LiveWallpaper.zip -Force

      - name: Upload Windows Live Wallpaper Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Windows-LiveWallpaper
          path: dist-windows/TimeOrbit-Windows-LiveWallpaper.zip
