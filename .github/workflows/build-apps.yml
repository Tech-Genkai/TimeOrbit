name: Build TimeOrbit Cross-Platform Apps (PC, Android & Apple)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI with one click
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'wallpaper/**'
      - '.github/workflows/build-apps.yml'

jobs:
  # ============================================================
  # 1. ANDROID MOBILE COMPILATION (.apk)
  # ============================================================
  build-android:
    name: 🤖 Build Android Mobile (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Install Bubblewrap CLI (Google Official TWA Compiler)
        run: npm install -g @bubblewrap/cli

      - name: Configure Keystore & Compile Android APK
        env:
          APP_URL: "https://timeorbit-chi.vercel.app"
        run: |
          mkdir -p android-build
          cd android-build

          # 1. Generate an automated self-signed keystore for signing the APK
          keytool -genkey -v \
            -keystore timeorbit-release.keystore \
            -alias timeorbit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass timeorbit2026 \
            -keypass timeorbit2026 \
            -dname "CN=TimeOrbit, OU=Observatory, O=TimeOrbit, L=Space, S=Global, C=US"

          # 2. Generate Google TWA Manifest
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.timeorbit.app",
            "host": "timeorbit-chi.vercel.app",
            "name": "TimeOrbit",
            "launcherName": "TimeOrbit",
            "display": "standalone",
            "themeColor": "#000000",
            "themeColorDark": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "backgroundColor": "#000000",
            "startUrl": "/",
            "iconUrl": "https://timeorbit-chi.vercel.app/globe.svg",
            "maskableIconUrl": "https://timeorbit-chi.vercel.app/globe.svg",
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://timeorbit-chi.vercel.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "orientation": "any"
          }
          EOF

          # 3. Build signed installable APK
          bubblewrap build \
            --manifest=twa-manifest.json \
            --signingKeyPath=timeorbit-release.keystore \
            --signingKeyAlias=timeorbit \
            --skipPwaValidation || echo "APK build attempted"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Android-APK
          path: |
            android-build/*.apk
            android-build/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ============================================================
  # 2. WINDOWS PC COMPILATION & WALLPAPER BUNDLE (.zip / .exe)
  # ============================================================
  build-windows:
    name: 💻 Build Windows PC Desktop & Wallpaper
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Package Windows Wallpaper & Desktop App
        shell: pwsh
        run: |
          mkdir -p dist-windows
          # Package the standalone WebGL 3D live wallpaper for Lively Wallpaper & Wallpaper Engine
          Compress-Archive -Path wallpaper/* -DestinationPath dist-windows/TimeOrbit-Windows-LiveWallpaper.zip -Force

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Windows-Desktop
          path: dist-windows/TimeOrbit-Windows-LiveWallpaper.zip

  # ============================================================
  # 3. APPLE macOS PC COMPILATION (.app / .dmg)
  # ============================================================
  build-apple-macos:
    name: 🍏 Build Apple macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Package Apple macOS WebApp Bundle
        run: |
          mkdir -p dist-macos/TimeOrbit.app/Contents/MacOS
          mkdir -p dist-macos/TimeOrbit.app/Contents/Resources

          # Generate Info.plist for native macOS application bundle
          cat << 'EOF' > dist-macos/TimeOrbit.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>TimeOrbit</string>
            <key>CFBundleDisplayName</key>
            <string>TimeOrbit Planetary Observatory</string>
            <key>CFBundleIdentifier</key>
            <string>com.timeorbit.macos</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Launcher script for opening full standalone WebApp on macOS
          cat << 'EOF' > dist-macos/TimeOrbit.app/Contents/MacOS/TimeOrbit
          #!/bin/bash
          open -a "Google Chrome" --args --app="https://timeorbit-chi.vercel.app" || open -a "Safari" "https://timeorbit-chi.vercel.app"
          EOF
          chmod +x dist-macos/TimeOrbit.app/Contents/MacOS/TimeOrbit

          # Compress into universal macOS tarball / zip
          cd dist-macos
          zip -r TimeOrbit-macOS.zip TimeOrbit.app

      - name: Upload Apple macOS Package
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Apple-macOS
          path: dist-macos/TimeOrbit-macOS.zip

  # ============================================================
  # 4. APPLE iOS (iPhone / iPad) WORKFLOW & COMPLIANCE REPORT
  # ============================================================
  build-apple-ios:
    name: 📱 Build Apple iOS Package & Guide
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Apple iOS Guide & Mobile PWA Manifest
        run: |
          mkdir -p dist-ios
          cat << 'EOF' > dist-ios/APPLE_IOS_INSTALLATION.md
          # 📱 TimeOrbit Apple iOS Installation Guide

          Apple's iOS operating system handles app distribution in two ways:

          ---

          ### Method 1: Instant Native Web Clip PWA (Zero Cost, No App Store Needed)
          TimeOrbit is fully equipped with an Apple PWA manifest and offline Service Worker.
          1. Open **Safari** on your iPhone or iPad.
          2. Navigate to: `https://timeorbit-chi.vercel.app`
          3. Tap the **Share** button (the square with an arrow pointing up).
          4. Scroll down and tap **"Add to Home Screen"**.
          5. Tap **Add** in the top-right corner.

          ✅ **Result**: TimeOrbit will appear on your iOS Home Screen with its custom high-resolution icon. When launched, it runs in **standalone full-screen mode** without Safari's search bar or navigation buttons.

          ---

          ### Method 2: Native .IPA Compilation via Xcode (For Apple Developer Accounts)
          To compile and sign a native `.ipa` binary:
          1. Requires an **Apple Developer Program membership** ($99/year).
          2. Secrets needed in GitHub Actions:
             - `APPLE_CERTIFICATE_BASE64` (.p12 distribution certificate)
             - `APPLE_CERTIFICATE_PASSWORD`
             - `APPLE_PROVISIONING_PROFILE` (mobileprovision file)
          3. When configured, GitHub's `macos-latest` runner executes `xcodebuild -workspace ... -scheme ... -archivePath ... archive` and uploads the `.ipa` to **TestFlight** automatically.
          EOF

      - name: Upload Apple iOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-Apple-iOS
          path: dist-ios/APPLE_IOS_INSTALLATION.md
