[package]
name = "timeorbit"
version = "0.1.0"
description = "TimeOrbit - 3D Planetary Observatory & Global Chronometer"
authors = ["Tech Genkai"]
edition = "2021"

[lib]
name = "timeorbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
